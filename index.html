<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor TFG - MFE + Cuadrículas</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Panel de control */
        .panel-control {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 250px;
        }
        h3 { margin: 0 0 10px 0; font-size: 14px; color: #2c3e50; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { 
            width: 100%; margin-top: 8px; padding: 10px; 
            background: #27ae60; color: white; border: none; 
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #219150; }
        #status { font-size: 11px; margin-top: 8px; color: #666; }
    </style>
</head>
<body>

<div class="panel-control">
    <h3>Buscador de Cuadrículas</h3>
    <input type="text" id="input-malla" placeholder="Ej: 30TVK42">
    <button onclick="buscarMalla()">🔍 Buscar y Centrar</button>
    <div id="status">Cargando datos...</div>
</div>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-3.703, 40.550],
        zoom: 8.5
    });

    let datosMalla = null;

    map.on('load', async () => {
        const status = document.getElementById('status');

        try {
            // 1. CARGAR MFE (Tu capa que ya funciona)
            map.addSource('mfe-source', {
                type: 'geojson',
                data: './Madrid_mfe_.geojson.json' 
            });
            map.addLayer({
                'id': 'capa-forestal',
                'type': 'fill',
                'source': 'mfe-source',
                'paint': { 'fill-color': '#2ecc71', 'fill-opacity': 0.4 }
            });

            // 2. CARGAR CUADRÍCULAS (Desde la carpeta capas)
            const resp = await fetch('./capas/Cuadriculas_madrid.geojson');
            datosMalla = await resp.json();

            map.addSource('malla-source', {
                type: 'geojson',
                data: datosMalla
            });

            // Dibujamos las líneas de la malla (finas y grises)
            map.addLayer({
                'id': 'capa-malla',
                'type': 'line',
                'source': 'malla-source',
                'paint': { 'line-color': '#95a5a6', 'line-width': 0.8, 'line-opacity': 0.6 }
            });

            // Capa especial para RESALTAR la cuadrícula buscada (en ROJO)
            map.addLayer({
                'id': 'capa-resaltado',
                'type': 'line',
                'source': 'malla-source',
                'paint': { 'line-color': '#e74c3c', 'line-width': 3 },
                'filter': ['==', 'Malla10km_', '']
            });

            status.innerHTML = "✅ Sistema listo. Introduce código.";

            // Pop-ups para el MFE (mantenemos lo anterior)
            map.on('click', 'capa-forestal', (e) => {
                const p = e.features[0].properties;
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`<b>Definición:</b> ${p.DEFINICION || 'N/A'}<br><b>Usos:</b> ${p.USOS_SUELO || 'N/A'}`)
                    .addTo(map);
            });

        } catch (e) {
            status.innerHTML = "❌ Error al cargar capas.";
            console.error(e);
        }
    });

    function buscarMalla() {
        const codigo = document.getElementById('input-malla').value.trim().toUpperCase();
        if (!codigo || !datosMalla) return;

        // Buscar la cuadrícula en el archivo JSON
        const feature = datosMalla.features.find(f => 
            f.properties.Malla10km_ && f.properties.Malla10km_.toUpperCase() === codigo
        );

        if (feature) {
            // Obtenemos una coordenada de la cuadrícula para mover el mapa
            const coords = feature.geometry.coordinates[0][0];
            
            map.flyTo({
                center: coords,
                zoom: 11.5,
                essential: true
            });

            // Aplicamos el filtro para que solo se ponga roja esa cuadrícula
            map.setFilter('capa-resaltado', ['==', 'Malla10km_', codigo]);
            document.getElementById('status').innerHTML = "📍 Viendo malla: " + codigo;
        } else {
            alert("La cuadrícula '" + codigo + "' no se encuentra en el archivo.");
        }
    }
</script>

</body>
</html>
