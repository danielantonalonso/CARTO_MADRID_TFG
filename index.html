<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor Forestal TFG - Madrid Pro</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f1; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Panel Izquierdo */
        .panel {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2); width: 280px;
            max-height: 85vh; overflow-y: auto;
        }
        .seccion { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; font-weight: bold; font-size: 11px; color: #1a5e37; margin-bottom: 8px; text-transform: uppercase; }
        
        .multi-select-container {
            max-height: 140px; overflow-y: auto; border: 1px solid #ddd;
            padding: 8px; border-radius: 6px; background: #fafafa;
        }
        .opcion-check { display: flex; align-items: center; font-size: 10.5px; margin-bottom: 4px; cursor: pointer; color: #333; }
        .opcion-check input { margin-right: 8px; }

        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* Leyenda Derecha */
        .leyenda {
            position: absolute; bottom: 30px; right: 10px; z-index: 10;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); width: 250px;
            display: none; max-height: 300px; overflow-y: auto;
        }
        .leyenda-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .color-box { width: 14px; height: 14px; margin-right: 8px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }
    </style>
</head>
<body>

<div class="panel">
    <div class="seccion">
        <label>📍 Cuadrícula</label>
        <input type="text" id="input-malla" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ddd;" placeholder="Ej: 30TVK42">
        <button onclick="buscarMalla()" style="margin-top:5px;">🔍 Buscar</button>
    </div>
