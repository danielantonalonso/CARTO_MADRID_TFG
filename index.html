<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor TFG Forestal - Madrid</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .titulo {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 250px;
        }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; cursor: pointer; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="titulo">
    <h3 style="margin:0;">Buscador de Mallas</h3>
    <input type="text" id="buscador-codigo" placeholder="Ej: 30TVK42">
    <button onclick="buscarCuadricula()">🔍 Buscar Malla</button>
</div>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-3.703, 40.416],
        zoom: 8
    });

    map.on('load', () => {
        // CAPA FORESTAL
        map.addSource('forestal-source', {
            type: 'geojson',
            data: './capas/Madrid_mfe.geojson'
        });
        map.addLayer({
            'id': 'capa-forestal',
            'type': 'fill',
            'source': 'forestal-source',
            'paint': { 'fill-color': '#2dcc71', 'fill-opacity': 0.4 }
        });

        // CAPA CUADRÍCULAS
        map.addSource('malla-source', {
            type: 'geojson',
            data: './capas/Cuadriculas_madrid.geojson'
        });
        map.addLayer({
            'id': 'capa-malla-lineas',
            'type': 'line',
            'source': 'malla-source',
            'paint': { 'line-color': '#7f8c8d', 'line-width': 1 }
        });

        // CAPA RESALTADO
        map.addLayer({
            'id': 'capa-resaltado',
            'type': 'line',
            'source': 'malla-source',
            'paint': { 'line-color': '#e74c3c', 'line-width': 4 },
            'filter': ['==', 'Malla10km_', '']
        });
    });

    function buscarCuadricula() {
        const valor = document.getElementById('buscador-codigo').value.trim();
        const features = map.querySourceFeatures('malla-source');
        const encontrada = features.find(f => f.properties.Malla10km_ === valor);

        if (encontrada) {
            const coord = encontrada.geometry.coordinates[0][0];
            map.flyTo({ center: coord, zoom: 12 });
            map.setFilter('capa-resaltado', ['==', 'Malla10km_', valor]);
        } else {
            alert("No encontrada. Revisa el código.");
        }
    }
</script>
</body>
</html>
