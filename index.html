<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor Forestal TFG - Madrid</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .panel {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 220px;
        }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; }
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .leyenda {
            position: absolute; bottom: 30px; right: 10px; z-index: 10;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); width: 280px;
            display: none; max-height: 300px; overflow-y: auto;
        }
        .leyenda-titulo { font-weight: bold; font-size: 13px; margin-bottom: 10px; color: #1a5e37; border-bottom: 2px solid #27ae60; padding-bottom: 4px; }
        .leyenda-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 11px; }
        .color-box { width: 14px; height: 14px; margin-right: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        #status-carga { font-size: 10px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="panel">
    <h3 style="margin:0 0 10px 0; font-size: 15px;">Buscador Malla</h3>
    <input type="text" id="input-malla" placeholder="Ej: 30TVK42">
    <button onclick="buscarMalla()">🔍 Ir a cuadrícula</button>
    <div id="status-carga">⏳ Cargando...</div>
</div>

<div class="leyenda" id="contenedor-leyenda">
    <div class="leyenda-titulo">Leyenda de la zona:</div>
    <div id="lista-leyenda"></div>
</div>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-3.703, 40.550],
        zoom: 8.5
    });

    // Función para generar un color único basado en un texto
    function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        let color = '#';
        for (let i = 0; i < 3; i++) {
            let value = (hash >> (i * 8)) & 0xFF;
            color += ('00' + value.toString(16)).substr(-2);
        }
        return color;
    }

    map.on('load', async () => {
        map.addSource('mfe-source', { 
            type: 'geojson', 
            data: './Madrid_mfe_.geojson.json'
        });
        
        map.addLayer({
            'id': 'capa-forestal',
            'type': 'fill',
            'source': 'mfe-source',
            'paint': {
                'fill-color': '#cccccc', // Color temporal
                'fill-opacity': 0.7
            }
        });

        // Carga de Malla
        fetch('./capas/Cuadriculas_madrid.geojson').then(r => r.json()).then(data => {
            window.datosMalla = data;
            map.addSource('malla-source', { type: 'geojson', data: data });
            map.addLayer({ 'id': 'malla-lineas', 'type': 'line', 'source': 'malla-source', 'paint': { 'line-color': '#7f8c8d', 'line-width': 0.5, 'line-opacity': 0.4 } });
            map.addLayer({ 'id': 'resaltado', 'type': 'line', 'source': 'malla-source', 'paint': { 'line-color': '#e74c3c', 'line-width': 4 }, 'filter': ['==', 'Malla10km_', ''] });
            document.getElementById('status-carga').innerHTML = "✅ Listo";
        });

        // Actualizar colores y leyenda cuando el mapa se mueva
        map.on('idle', () => {
            const features = map.queryRenderedFeatures({ layers: ['capa-forestal'] });
            if (features.length > 0) {
                const cats = [...new Set(features.map(f => f.properties.DEFINICION))].filter(d => d).sort();
                
                // Creamos un estilo de color dinámico para las teselas visibles
                const colorMatch = ['match', ['get', 'DEFINICION']];
                const lista = document.getElementById('lista-leyenda');
                lista.innerHTML = '';

                cats.forEach(cat => {
                    const color = stringToColor(cat);
                    colorMatch.push(cat, color);
                    
                    // Solo mostramos en la leyenda si estamos cerca (zoom > 10.5)
                    if (map.getZoom() > 10.5) {
                        lista.innerHTML += `
                            <div class="leyenda-item">
                                <div class="color-box" style="background:${color}"></div>
                                <span>${cat}</span>
                            </div>`;
                    }
                });

                colorMatch.push('#cccccc'); // Color por defecto
                map.setPaintProperty('capa-forestal', 'fill-color', colorMatch);
                
                // Mostrar/Ocultar leyenda según zoom
                document.getElementById('contenedor-leyenda').style.display = (map.getZoom() > 10.5) ? 'block' : 'none';
            }
        });

        map.on('click', 'capa-forestal', (e) => {
            const p = e.features[0].properties;
            new maplibregl.Popup().setLngLat(e.lngLat)
                .setHTML(`<b>Definición:</b> ${p.DEFINICION}<br><b>Uso:</b> ${p.USOS_SUELO}`)
                .addTo(map);
        });
    });

    function buscarMalla() {
        const cod = document.getElementById('input-malla').value.trim().toUpperCase();
        if (!window.datosMalla) return;
        const f = window.datosMalla.features.find(x => x.properties.Malla10km_ === cod);
        if (f) {
            map.flyTo({ center: f.geometry.coordinates[0][0], zoom: 12 });
            map.setFilter('resaltado', ['==', 'Malla10km_', cod]);
        }
    }
</script>
</body>
</html>
