<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor Forestal TFG</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .indicador {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; padding: 15px; border-radius: 8px;
            font-family: Arial, sans-serif; box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="indicador">
    <strong>Estado de la capa:</strong> <span id="msg">Cargando 79MB...</span>
    <br><small>Ten paciencia, el archivo es muy pesado.</small>
</div>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-3.703, 40.416], // Centro de Madrid
        zoom: 8
    });

    map.on('load', () => {
        // AQUÍ HEMOS QUITADO LA CARPETA "capas/" PORQUE EL ARCHIVO ESTÁ SUELTO
        map.addSource('mfe-source', {
            type: 'geojson',
            data: './Madrid_mfe_.geojson.json' 
        });

        map.addLayer({
            'id': 'capa-forestal',
            'type': 'fill',
            'source': 'mfe-source',
            'paint': {
                'fill-color': '#27ae60',
                'fill-opacity': 0.6
            }
        });

        // Comprobador de carga
        map.on('sourcedata', (e) => {
            if (e.sourceId === 'mfe-source' && e.isSourceLoaded) {
                document.getElementById('msg').innerHTML = "✅ CAPA CARGADA";
                document.getElementById('msg').style.color = "green";
            }
        });

        // Detector de errores
        map.on('error', (e) => {
            document.getElementById('msg').innerHTML = "❌ ERROR: No se puede leer el archivo";
            document.getElementById('msg').style.color = "red";
            console.error(e);
        });
    });
</script>

</body>
</html>
